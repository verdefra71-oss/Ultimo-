name: Build Preventivi Android e Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - name: Prepare Android project
        shell: bash
        run: flutter create --platforms=android --project-name preventivi_app .
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Preventivi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Generate native Windows project
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name preventivi_app .
          # flutter create crea il test di esempio che cerca MyApp; questa app usa una classe diversa.
          if (Test-Path 'test/widget_test.dart') { Remove-Item 'test/widget_test.dart' -Force }
          New-Item -ItemType Directory -Force windows/runner/resources | Out-Null
          if (Test-Path 'assets/app_icon.ico') {
            Copy-Item 'assets/app_icon.ico' 'windows/runner/resources/app_icon.ico' -Force
          } else {
            Write-Host "assets/app_icon.ico non presente: uso l'icona Windows predefinita di Flutter."
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup non trovato" }
          @"
          #define MyAppName "Gestione Preventivi - Il Tornitore"
          #define MyAppVersion "1.0.0"
          #define MyAppPublisher "Il Tornitore"
          #define MyAppExeName "preventivi_app.exe"

          [Setup]
          AppId={{B4D4E8C6-6C9B-4D6B-9B3B-9B7A8A4F2E11}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\Gestione Preventivi - Il Tornitore
          DefaultGroupName={#MyAppName}
          OutputDir=installer
          OutputBaseFilename=Gestione-Preventivi-Il-Tornitore-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\{#MyAppExeName}
          ; L'icona personalizzata viene usata solo se il file esiste
          PrivilegesRequired=lowest
          WizardStyle=modern

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Avvia {#MyAppName}"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Encoding UTF8 installer.iss
          & $iscc installer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Windows-Installer
          path: installer/Gestione-Preventivi-Il-Tornitore-Setup.exe
          if-no-files-found: error

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Preventivi-Windows-Portable
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
